# Release a Ghost Proxifier plugin: push a tag v<version> and this packs,
# signs, verifies and publishes the three assets Ghost downloads
# (docs/plugin-sdk/spec-release.md §3):
#
#   ghost-plugin.json  ghost-plugin.json.sig  <id>-<version>.gpkg
#
# One-time setup (the SDK's README, "From zero to listed"):
#   * python gpkg.py keygen --out <somewhere OUTSIDE this repository>/
#   * commit dev-public.b64 at the repository root (public; the registry pins it)
#   * put the whole of dev-private.pem into the repository secret
#     GHOST_DEV_KEY_PEM -- and nowhere else. Never commit it.
#
# The private key exists on the runner for one step, in $RUNNER_TEMP (outside
# the workspace, so it can never be packed), and is deleted when that step
# ends, whatever happened.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # The SDK (tools/plugin/) comes from a PUBLIC repository at a FIXED commit, not
  # a branch: a tool that signs your releases should not change under you. Both
  # are placeholders the first step refuses until they are set -- the SDK's
  # docs/plugin-sdk/maintainer.md says where the public SDK lives, and the
  # commit must contain the gpkg.py subcommands this workflow calls.
  SDK_REPO: liliBestCoder/ghost-plugin-sdk
  SDK_REF: 4a6fc4b7d593a7b9c1fdd905a42d81a5a5baad6a
  # The oldest Ghost Proxifier that may install this release.
  MIN_APP_VERSION: 1.2.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: The SDK is pinned (maintainer, read this if it fails)
        run: |
          if [ "$SDK_REPO" = "SET-ME-TO-THE-PUBLIC-SDK-REPO" ]; then
            echo "::error::SDK_REPO is still the placeholder. Set it to the PUBLIC repository (owner/name) that carries tools/plugin/ -- this workflow checks it out with its own GITHUB_TOKEN, which cannot read a private repository."
            exit 1
          fi
          if ! printf '%s' "$SDK_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::SDK_REF must be the 40-character sha of a commit of $SDK_REPO whose tools/plugin/gpkg.py has every subcommand used below; it is '$SDK_REF'"
            exit 1
          fi

      - name: Check out the plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          path: plugin

      - name: Check out the SDK tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: ${{ env.SDK_REPO }}
          ref: ${{ env.SDK_REF }}
          sparse-checkout: tools/plugin
          path: sdk

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install cryptography (pinned, hashed)
        run: python -m pip install --require-hashes --only-binary=:all: -r plugin/.github/requirements-release.txt

      - name: The tag is v<manifest.json version>
        working-directory: plugin
        run: |
          version=$(python -c "import json; print(json.load(open('manifest.json', 'rb'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest.json version $version -- the tag must be v$version (Ghost only downloads releases/download/v<version>/)"
            exit 1
          fi

      - name: Leave out what is for this repository, not for users
        # pack takes every file it finds; the tests and .gitignore are how this
        # repository is developed, and a user who installs the plugin needs
        # neither. (dev-public.b64 stays: the verify step below uses it.)
        run: rm -rf plugin/tests plugin/.gitignore

      - name: Pack
        run: python sdk/tools/plugin/gpkg.py pack --src plugin --out dist --min-app-version "$MIN_APP_VERSION"

      - name: Sign
        env:
          GHOST_DEV_KEY_PEM: ${{ secrets.GHOST_DEV_KEY_PEM }}
        run: |
          key="$RUNNER_TEMP/dev-private.pem"
          trap 'rm -f "$key"' EXIT
          if [ -z "$GHOST_DEV_KEY_PEM" ]; then
            echo "::error::the repository secret GHOST_DEV_KEY_PEM is not set"
            exit 1
          fi
          umask 077
          printf '%s' "$GHOST_DEV_KEY_PEM" > "$key"
          python sdk/tools/plugin/gpkg.py sign --key "$key" --dist dist
          rm -f "$key"

      - name: Verify with the committed public key
        working-directory: plugin
        run: python ../sdk/tools/plugin/gpkg.py verify --dist ../dist --pubkey dev-public.b64

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ghost-plugin.json dist/ghost-plugin.json.sig dist/*.gpkg \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Release $GITHUB_REF_NAME"
